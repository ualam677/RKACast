name: Android build

on:
  push:
    branches: [ccr-680b12f6-ib3jwo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RKACast.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RKACast-apk
          path: RKACast.apk
      - name: Publish release (stable link: releases/latest/download/RKACast.apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RKACast build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.
            Direct download: https://github.com/${{ github.repository }}/releases/latest/download/RKACast.apk
          files: RKACast.apk
